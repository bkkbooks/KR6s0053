body:
  text: 終南山僧慧觀撰序南嶽泰公著五讚十頌當時稱之以美談及樂浦香嚴尤長厥頌斯則助道之端耳自祖燈相囑始迦葉終曹溪凡三十三祖信衣之後逮數人先賢之所未讚者愚且病焉雖寶林祖述其事閲而可委奈何忘機尚懶者或陋其繫遠殘秋之夕愚得以前意請於千佛僜禪師雖罕讓而弗獲免未信宿而成蓋辭理生千佛之筆當時問答奇句或糅其間約字雖則未多此識者曆觀諸聖之作於是乎在矣亦猶納須彌於芥子其橙一也是以命箋染翰為之序云西國二十八代祖師及唐土六祖師後慶明覺大師述初祖大迦葉尊者偉哉迦葉密傳佛心身依一納口海千尋威儀庠序化道幽深未逢慈氏且定雞岑第二祖阿難尊者多聞慶喜高建法幢傳佛金偈繼祖銀釭慈悲第一智慧無雙飲光後躅月印秋江第三祖商那和修尊者胎衣尊者暗室明燈人天耳目佛法股肱非心非色無減無增良哉至理覺海大鵬第四祖優波毱多尊者優波鞠多辨瀉玄河法山崷道樹婆娑籌盈石室尸繫天魔性非十七悟在剎那第五祖提多迦尊者多迦大士無我出家了根達境兔月空花體非形相理出齒牙隨方利物豈有匏瓜薄交反以瓠可為飲瓜亦又音雹瓜雹也第六祖彌遮迦彌遮加祖習五通仙遇師正法看我心偏悟如未悟玄之又玄神通示滅八部潛然第七祖婆須蜜尊者祖婆須蜜入彌遮室迷悟本如物我冥一平携酒器項擎佛曰奚是奚非誰得誰失第八祖佛陀難提尊者佛陀難提大化群迷心無心外法理高位五天論將三界雲梯卓然真氣南北東西第九祖伏陀蜜多尊者伏陀蜜多大器晚成五十不語五十不行我逢達士倐契無生崖松有操秋雞無程第十祖脅尊者脅大尊者愛憎網𭫠量等虛空道準簫灑真體自然因真舒憑幼世蒼芒奔騰意馬第十一祖富那夜奢尊者富那夜奢智若須彌心指法住身外榮衰明暗隱顯視聽希夷現前提住更不參差第十二祖馬鳴菩薩尊者尊者馬鳴化花成魔宮霧卷𮇸苑風清我欲識佛不識者朋莫非玄解動足塵生第十三祖迦毗羅尊者毗羅尊聖因地魔王憑師指教殺證真常胡為愚智誰是矩長德馨性淨蘭蕙氷霜第十四祖龍樹菩薩尊者菩薩龍樹化龍是霧心曉佛心住而靡住身現圓了法流膏雨提婆機投孰暗旨趣第十五祖迦那提婆尊者迦那提婆德岸彌高回旋香象欠呿金毛機通嵒雷辨瀉秋濤始終絶證勿誤王刀第十六祖羅睺羅多尊者羅睺道德在口寧論因師説耳尋得人門高提日了大照乾坤不取不捨傳乎子孫第十七祖僧迦難提尊者僧迦難提莊嚴王子逾域九重入山千里定喻井金義乖終始理屈於師忽窮自己第十八祖迦耶舍多尊者迦耶舍多幼會佛機手携寶鏡面難提師內外絶翳眉目無虧風飄鐸韻非我而誰第十九祖鳩摩羅多尊者鳩摩羅多大常止簷蒙師為澤委父無厭本非鍛鍊肯藉鎚鉗一榻孤坐人天禮瞻第二十祖闍夜多尊者闍夜多祖格高貌古錫有六環田無半畝言下不生何處不普垂手入鄽他方此土第二十一祖婆修盤頭尊者婆修盤頭修行不臥雖曆辛勤翻成懶墮因指見見逢歌拍和泡幻無真聽情無過第二十二祖摩拏羅尊者辨塔降勇自在王子雷震蟄行邪師失齒神運六通道風千里聲色恆真何須聵耳第二十三祖鶴勒尊者尊者鶴勒上德不得任性縱橫發言奇特功高二義名宜萬國稽首歸依祖林膽蔔第二十四祖師子尊者師子尊者人天仰譽空裏案青雲間鶴翥論鼓才聲法輪高御㭫柆邪徒梧真去處第二十五祖婆舍斯多尊者婆舍斯多久離攀沿未逢作者終不聞拳傳師衣鉢度物橋船當心妙見豈假言宜第二十六祖不如蜜多者不如蜜多勝王誕慶高遠空嬪逈就道行佛法梗梁王以瞻敬洞鑒如研祖堂金鏡第二十七祖般若多羅尊者般若多羅幼名瓔珞父母淪亡東西盤泊一曉龜毛恆嗟水涸果滿菩提道源遼廓第二十八祖唐土六代祖師第一達摩祖師菩提達摩道化無為九年少室六葉宗師示滅能耳隻履西歸梁天不薦惠可傳衣第二祖惠可大師二祖碩學操為堅確心貫三乘項寄五嶽天上麒麟人間鸑鷟斷臂立靈混而不濁第三祖僧璨大師三祖大師諸王真子語出幽微心無彼此或處山林或居鄽示因地花生栴檀𭥃旎第四祖道信大師四祖十四因師解脫處世道孤與慈量闊永絶雕熒逈法始末果少花多忍傳衣鉢第五祖弘忍大師五祖七歲洞達言前石牛吐霧木馬含咽身心恆寂理事俱玄無情無種千年萬年第六祖惠能大師師造黃梅得旨南來爰因幡義大震法雷道明遭過神秀逢回衣雖不付天下花開南嶽讓和尚法祖嗣六祖觀音和尚厥名懷讓般若栖神禪門呆匠五嶽德高四溟心量法嗣六人馬祖興王吉州行司和尚法嗣六祖吉水真人出世盧陵唯提一脈逈出三乘𤅀中月燭火裏行水訐君妙會説衣想應國師惠忠和尚法嗣司和尚唐朝國師大播鴻猷曹溪探月渭水乘舟二天請問四衆拋等法才極瞻大耳慚羞石頭和尚法嗣和尚南嶽石頭吉水分流庵栖碧洞車駕白牛學成麟角譽漏神舟僧問淨土不垢何求江西馬和尚法嗣讓和尚馬師道一行全金石悟本超然尋枝勞役久定身心一時拋擲大化南昌寒松千尺沙州三界寺沙門道真記
